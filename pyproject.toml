[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex9-git-safe-directory-discovery-model"
version = "0.1.0"
description = "In-memory model of git repository discovery and the safe.directory ownership check (CVE-2022-24765)"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = []

[project.scripts]
git-safedir-model = "git_safedir_model.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
